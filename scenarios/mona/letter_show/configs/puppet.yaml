platform: pygame

mona:
  # mode determines which external systems are wired up:
  #   full_simulation : pure simulation (no real robot, no real comm)
  #   puppet          : UDP G-commands + WhyCon (real motion, sim comm)
  mode: puppet

  # Real-robot endpoints. Active in: puppet. Ignored in: full_simulation.
  robots:
    - {agent_id: 0, host: 192.168.0.47, port: 8080}
    - {agent_id: 1, host: 192.168.0.56, port: 8080}
    - {agent_id: 2, host: 192.168.0.46, port: 8080}
    - {agent_id: 3, host: 192.168.0.48, port: 8080}
    - {agent_id: 4, host: 192.168.0.58, port: 8080}
    - {agent_id: 5, host: 192.168.0.55, port: 8080}
    - {agent_id: 6, host: 192.168.0.60, port: 8080}
    - {agent_id: 7, host: 192.168.0.59, port: 8080}
    - {agent_id: 8, host: 192.168.0.62, port: 8080}

  udp_port: 9999          # WhyCon listener bind port. Active in: puppet. Ignored in: full_simulation.
  battery_listen_port: 5005  # Robot→sim battery telemetry port. Active in: puppet. Ignored in: full_simulation.
  distance_scale: 1.0     # UDP G-command distance scaling.   Active in: puppet. Ignored in: full_simulation.

scenario: 
  environment: scenarios.mona.letter_show

decision_making:
  plugin: scenarios.mona.letter_show.plugins.dec_hungarian.DistributedHungarian

  # ── Phase 1: Super-Task allocation via GRAPE ─────────────────────
  GRAPE:
    cost_weight_factor: 0.03
    social_inhibition_factor: 0.0        # mild – all group members should converge on same ST
    initialize_partition: Distance     # Options: None; Distance
    reinitialize_partition_on_completion: Distance
    battery_aware: true                  # true → S-RA (battery_ratio × urgency_factor); false → Equal (base GRAPE)

  # ── Phase 2: Regular-Task allocation via DistributedHungarian ────
  Hungarian:
    task_reward_discount_factor: 0.999
    epsilon: 1e-10
    dummy_cost: 0.0

agents:
  behavior_tree_xml: default_bt.xml 
  quantity: 9
  fixed_positions:
    - [40, 40]      # agent 0 (top-left corner)
    - [40, 700]     # agent 1 (bottom-left corner)
    - [1300, 700]   # agent 2 (bottom-right corner)
    - [1300, 40]    # agent 3 (top-right corner)
    - [40, 370]    # agent 4 (center-left top)
    - [1300, 246]    # agent 5 (center-left bottom)
    - [670, 40]    # agent 6 (center-right top)
    - [670, 700]    # agent 7 (center-right bottom)
    - [1300, 493]    # agent 8 (center-right bottom)
  fixed_batteries:   # Initial battery % per agent (optional; omit to use random 40~90%)
    - 100.0   # agent 0
    - 95.0   # agent 1
    - 90.0   # agent 2
    - 85.0   # agent 3
    - 80.0   # agent 4
    - 50.0   # agent 5
    - 45.0   # agent 6
    - 40.0   # agent 7
    - 35.0   # agent 8
  fixed_angles:     # Initial heading in radians (optional, defaults to 0)
    - 0.00000000           #    0  degree
    - 0.00000000           #    0  degree
    - 3.14159265           #  180  degree
    - 3.14159265           #  180  degree
    - 0.00000000           #    0  degree
    - 0.00000000           #    0  degree
    - 1.57079632           #  90  degree
    - 4.71238897           #  270  degree
    - 0.00000000           #    0  degree
  locations:
    x_min: 0
    x_max: 1340
    y_min: 0
    y_max: 740
    non_overlap_radius: 0 
  # --- Motion dynamics (sim-only) -----------------------------------------
  # Used by the rotation-shim controller in full_simulation. Ignored in
  # puppet — ESP32 firmware decides motor PWM and gains itself; the host
  # only sends raw 'G <angle_deg> <distance_mm>' commands.
  max_speed: 3.0
  max_accel: 1.0
  max_angular_speed: 0.08
  target_approaching_radius: 50         # arrival slow-down radius

  # --- Active in all modes ------------------------------------------------
  body_radius: 40   # MONA physical footprint in simulator pixels.
                    # Adjust together with WhyCode camera calibration so
                    # the drawn circle matches the actual robot extent.
  work_rate: 10  # work rate for each agent (per 1.0/simulation.sampling_freq)
  communication_radius: 2000 # 0 represents "global", meaning that each agent can access to the information of all the other agents
  situation_awareness_radius: 2000 # 0 represents "global", meaning that each agent can access to the information of all the tasks
  random_exploration_duration: 1000.0 # sec

super_tasks:
  # Each group is a list of task indices (0-based) that form one Super Task.
  # Position = average of member-task coordinates.
  # Size:  3 tasks → 200×200 px,  6 tasks → 300×300 px,  9 tasks → 400×400 px
  groups:
    - tasks: [0, 1, 2]           # Super Task 0  (3 tasks)
    - tasks: [3, 4, 5, 6, 7, 8] # Super Task 1  (6 tasks)

