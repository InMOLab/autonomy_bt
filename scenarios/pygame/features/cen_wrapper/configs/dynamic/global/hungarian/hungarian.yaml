scenario: 
  environment: scenarios.pygame.features.cen_wrapper

decision_making:
  plugin: plugins.mrta.hungarian.dec_hungarian.DistributedHungarian
  cen_plugin: scenarios.pygame.features.cen_wrapper.plugins.hungarian.Hungarian
  Hungarian:
    task_reward_discount_factor: 0.999
    epsilon: 1e-10
    dummy_cost: 0.0

case_name: HUNGARIAN
setup: HUNGARIAN_N12_M12
agents:
  # ── cen_wrapper communication semantics ──────────────────────────────
  # Leader.communication_radius   → leader↔follower broadcast reach
  # Follower.communication_radius → follower↔follower mesh range
  # (0 == global for both; implemented via Agent.get_agents_nearby override
  #  in scenarios/.../cen_wrapper/sim/agent.py)
  # ─────────────────────────────────────────────────────────────────────
  types:
    Leader:
      behavior_tree_xml: bt_leader_baseline.xml
      quantity: 1
      communication_radius: 2000 # 0 represents "global", meaning that each agent can access to the information of all the other agents
      situation_awareness_radius: 2000 # 0 represents "global", meaning that each agent can access to the information of all the tasks
    Follower:
      behavior_tree_xml: bt_follower_global.xml
      quantity: 12
      communication_radius: 2000 # 0 represents "global", meaning that each agent can access to the information of all the other agents
      situation_awareness_radius: 2000 # 0 represents "global", meaning that each agent can access to the information of all the tasks
  locations:
    x_min: 0
    x_max: 1400
    y_min: 0
    y_max: 1000
    non_overlap_radius: 0 
  max_speed: 0.25  
  max_accel: 0.05
  max_angular_speed: 0.25
  target_approaching_radius: 50
  work_rate: 1  # work rate for each agent (per 1.0/simulation.sampling_freq)
  random_exploration_duration: 1000.0 # sec
  communication_time_endurance : 2.0 # sec

tasks:
  quantity: 12
  locations:
    x_min: 0
    x_max: 1400
    y_min: 0
    y_max: 1000
    non_overlap_radius: 0
  threshold_done_by_arrival: 10.0
  amounts:  # Added amounts range for tasks
    min: 6.0
    max: 60.0      
  dynamic_task_generation:
    enabled: False
    interval_seconds: 2000
    max_generations: 12
    tasks_per_generation: 1

simulation:
  message_snapshot: true   # parallel-execution emulation (needed for cen_wrapper 3-way equivalence)
  mode: dynamic
  random_seed: 1  # Random seed (integer ≥ 1), or None to disable seeding
  sampling_freq: 1.0 
  speed_up_factor: 0 # 0 mean max booster; 1 means normal; 10 means 10-times faster
  max_simulation_time: 0 # 0 means no limit
  agent_track_size: 400  
  screen_width: 1400 
  screen_height: 1000 
  gif_recording_fps: 0.05  
  task_visualisation_factor: 3  # visualization factor for tasks : 10 means converting 10 amount to 1 pixel
  profiling_mode: False
  rendering_mode: Screen  # Options: Screen; Terminal; None
  rendering_options: # Only works if `rendering_mode` is `Screen`
    agent_tail: True
    agent_communication_topology: False
    leader_communication_radius_circle: True
    leader_communication_topology: True
    agent_situation_awareness_circle: False
    agent_communication_radius_circle: False
    agent_id: True
    agent_work_done: True
    agent_assigned_task_id: True
    agent_path_to_assigned_tasks: True
    task_id: False
  saving_options:
    output_folder: output
    with_date_subfolder: True
    save_gif: False  # Only works if `rendering_mode` is `Screen`
    save_timewise_result_csv: True    
    save_agentwise_result_csv: True
    save_config_yaml: True
  bt_visualiser:
    enabled: True       # Set to True to enable BT visualisation, False to disable
    agent_id: 1         # ID of the agent whose behaviour tree will be visualised